services:
  app:
    build: .
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: caddy_management
      DB_USER: root
      DB_PASS: rootpass
      TZ: Asia/Bangkok
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    command: --default-time-zone=+07:00
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: caddy_management
      TZ: Asia/Bangkok
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro
      - ./database/migrations/001_caddies.sql:/docker-entrypoint-initdb.d/001_caddies.sql:ro
      - ./database/migrations/002_caddy_queue_status.sql:/docker-entrypoint-initdb.d/002_caddy_queue_status.sql:ro
      - ./database/migrations/003_rounds.sql:/docker-entrypoint-initdb.d/003_rounds.sql:ro
      - ./database/migrations/004_wage_rates.sql:/docker-entrypoint-initdb.d/004_wage_rates.sql:ro
      - ./database/migrations/005_leave.sql:/docker-entrypoint-initdb.d/005_leave.sql:ro
      - ./database/migrations/006_advance_booking.sql:/docker-entrypoint-initdb.d/006_advance_booking.sql:ro
      - ./database/migrations/007_payroll.sql:/docker-entrypoint-initdb.d/007_payroll.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
