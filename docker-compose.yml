services:
  app:
    build: .
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_NAME: caddy_management
      DB_USER: root
      DB_PASS: rootpass
      TZ: Asia/Bangkok
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@caddymanagement.local
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ตัวดักอีเมลสำหรับพัฒนา/ทดสอบเท่านั้น (ตั๋ว #21) — ไม่ส่งอีเมลจริงออกอินเทอร์เน็ต ดูอีเมลที่ "ส่ง" แล้วได้ที่ http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: mariadb:10.11
    command: --default-time-zone=+07:00
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: caddy_management
      TZ: Asia/Bangkok
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro
      - ./database/migrations/001_caddies.sql:/docker-entrypoint-initdb.d/001_caddies.sql:ro
      - ./database/migrations/002_caddy_queue_status.sql:/docker-entrypoint-initdb.d/002_caddy_queue_status.sql:ro
      - ./database/migrations/003_rounds.sql:/docker-entrypoint-initdb.d/003_rounds.sql:ro
      - ./database/migrations/004_wage_rates.sql:/docker-entrypoint-initdb.d/004_wage_rates.sql:ro
      - ./database/migrations/005_leave.sql:/docker-entrypoint-initdb.d/005_leave.sql:ro
      - ./database/migrations/006_advance_booking.sql:/docker-entrypoint-initdb.d/006_advance_booking.sql:ro
      - ./database/migrations/007_payroll.sql:/docker-entrypoint-initdb.d/007_payroll.sql:ro
      - ./database/migrations/008_profiles.sql:/docker-entrypoint-initdb.d/008_profiles.sql:ro
      - ./database/migrations/009_caddy_profile.sql:/docker-entrypoint-initdb.d/009_caddy_profile.sql:ro
      - ./database/migrations/010_booking_details.sql:/docker-entrypoint-initdb.d/010_booking_details.sql:ro
      - ./database/migrations/011_cart_number.sql:/docker-entrypoint-initdb.d/011_cart_number.sql:ro
      - ./database/migrations/012_leave_approval.sql:/docker-entrypoint-initdb.d/012_leave_approval.sql:ro
      - ./database/migrations/013_round_ratings.sql:/docker-entrypoint-initdb.d/013_round_ratings.sql:ro
      - ./database/migrations/014_caddy_accounts.sql:/docker-entrypoint-initdb.d/014_caddy_accounts.sql:ro
      - ./database/migrations/015_attendance_log.sql:/docker-entrypoint-initdb.d/015_attendance_log.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
